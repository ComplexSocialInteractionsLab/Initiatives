<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Lighthouse | Classified</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        void: '#010308',     // Deepest black/blue
                        obelisk: '#060a14',  // Lighthouse structure
                        beacon: '#06b6d4',   // Cyan light
                    },
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    letterSpacing: {
                        widest: '.25em',
                        ultra: '.5em',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap');

        :root {
            /* These update via JS to rotate the beam */
            --beam-angle: 0deg;
            /* The physical origin point of the light (Matches the SVG lantern) */
            --lantern-x: 50vw;
            --lantern-y: calc(100vh - 180px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #010308;
            overflow: hidden;
            user-select: none;
        }

        /* Ambient CRT Noise */
        .noise-overlay {
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: overlay;
        }

        /* LAYER 1: Always visible, but very dim */
        .layer-dim {
            position: absolute;
            inset: 0;
            z-index: 10;
        }

        .layer-dim .reveal-text {
            color: #1e293b;
            /* Dim slate */
            opacity: 0.3;
        }

        /* LAYER 2: Bright, glowing, but hidden by default via CSS Mask */
        .layer-bright {
            position: absolute;
            inset: 0;
            z-index: 20;
            -webkit-mask-image: conic-gradient(from var(--beam-angle) at var(--lantern-x) var(--lantern-y),
                    black 0deg,
                    black 4deg,
                    rgba(0, 0, 0, 0.1) 12deg,
                    /* Sharp cutoff ahead of the beam */
                    transparent 20deg,
                    /* Darkness ahead */
                    transparent 120deg,
                    /* Darkness on the opposite side */
                    rgba(0, 0, 0, 0.01) 180deg,
                    /* Phosphor glow starts fading in half a rotation behind */
                    rgba(0, 0, 0, 0.08) 250deg,
                    /* Glow slowly intensifying */
                    rgba(0, 0, 0, 0.3) 310deg,
                    /* Noticeable glowing trail */
                    rgba(0, 0, 0, 0.7) 345deg,
                    /* Bright trail right behind the beam */
                    black 355deg,
                    black 360deg);
            mask-image: conic-gradient(from var(--beam-angle) at var(--lantern-x) var(--lantern-y),
                    black 0deg,
                    black 4deg,
                    rgba(0, 0, 0, 0.1) 12deg,
                    transparent 20deg,
                    transparent 120deg,
                    rgba(0, 0, 0, 0.01) 180deg,
                    rgba(0, 0, 0, 0.08) 250deg,
                    rgba(0, 0, 0, 0.3) 310deg,
                    rgba(0, 0, 0, 0.7) 345deg,
                    black 355deg,
                    black 360deg);
        }

        .layer-bright .reveal-text {
            color: #fff;
            text-shadow: 0 0 12px #06b6d4, 0 0 25px #06b6d4, 0 0 45px #06b6d4;
        }

        /* LAYER 3: The visual beam of light */
        .visual-beam {
            position: absolute;
            inset: 0;
            z-index: 15;
            background: conic-gradient(from var(--beam-angle) at var(--lantern-x) var(--lantern-y),
                    rgba(255, 255, 255, 0.3) 0deg,
                    rgba(255, 255, 255, 0.3) 4deg,
                    rgba(6, 182, 212, 0.1) 12deg,
                    transparent 20deg,
                    transparent 340deg,
                    rgba(6, 182, 212, 0.1) 348deg,
                    rgba(255, 255, 255, 0.3) 356deg,
                    rgba(255, 255, 255, 0.3) 360deg);
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease-in;
        }

        .beam-active {
            opacity: 1;
        }

        /* The Lighthouse Obelisk */
        .lighthouse-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 250px;
            z-index: 30;
            pointer-events: none;
        }

        .core-light {
            animation: pulse-core 2s infinite alternate;
        }

        @keyframes pulse-core {
            0% {
                fill: #0891b2;
                filter: drop-shadow(0 0 5px #06b6d4);
            }

            100% {
                fill: #cffafe;
                filter: drop-shadow(0 0 25px #06b6d4) drop-shadow(0 0 50px #fff);
            }
        }

        /* Startup Sequence Fades */
        .startup-fade {
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .status-inactive {
            color: #ef4444;
            /* red */
            text-shadow:
                0 0 6px #ef4444,
                0 0 12px #ef4444,
                0 0 24px #b91c1c;
            font-weight: 700;
        }

        .layer-dim .status-inactive {
            opacity: 0;
        }

        /* red */


        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
    <!-- SEO Metadata -->
    <meta name="author" content="Shlok Tomar">
    <meta name="description"
        content="Project Lighthouse by Shlok Tomar: An automated AI system for cross-jurisdictional legal mapping and conflict detection using advanced machine learning.">

    <!-- JSON-LD Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchProject",
      "name": "Project Lighthouse",
      "author": {
        "@type": "Person",
        "name": "Shlok Tomar"
      },
      "keywords": ["Computer Science", "Artificial Intelligence", "AI", "Machine Learning", "ML", "LLM", "AI Research", "Software"]
    }
    </script>
</head>

<body>

    <div class="noise-overlay"></div>

    <!-- TEMPLATE: This content is cloned into both the dim and bright layers -->
    <template id="content-template">
        <div class="relative w-full h-full p-8 md:p-16 flex flex-col justify-between">

            <!-- Top Data Nodes -->
            <div class="flex justify-between w-full">
                <div class="reveal-text font-mono text-[10px] md:text-xs tracking-widest leading-loose">
                    SYS.NODE.01<br>
                    WA-LAW-EMBED-V1.5<br>
                    STATUS: <span class="status-inactive">INACTIVE</span>
                </div>

                <div class="reveal-text font-mono text-[10px] md:text-xs tracking-widest text-right leading-loose">
                    VECTORS: 50,413<br>
                    DIMENSIONS: 768<br>
                    LOSS_OBJ: MNR
                </div>
            </div>

            <!-- Central Titles -->
            <div
                class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center w-full max-w-4xl px-4">
                <h2 class="reveal-text font-mono text-xs md:text-sm tracking-ultra mb-4 uppercase">
                    <span class="status-inactive">RESTRICTED ACCESS</span>
                </h2>
                <h1 class="reveal-text font-display text-4xl md:text-7xl font-bold tracking-widest mb-4">
                    PROJECT <br class="md:hidden">LIGHTHOUSE
                </h1>
                <p class="reveal-text font-mono text-xs md:text-sm max-w-xl mx-auto leading-relaxed opacity-80">
                    Automated multi-tiered legal mapping<br>
                    Cross-jurisdictional preemption engine
                </p>
            </div>

            <!-- Floating Anomalies (Positioned absolutely to get hit by the beam at different times) -->
            <div
                class="absolute top-[20%] left-[15%] reveal-text font-mono text-[9px] tracking-widest border border-current p-2">
                TARGET: RCW 9A.56
            </div>
            <div
                class="absolute top-[60%] right-[10%] reveal-text font-mono text-[9px] tracking-widest border border-current p-2">
                CONFLICT DETECTED: 87.3%
            </div>
            <div class="absolute top-[50%] left-[20%] reveal-text font-mono text-[9px] tracking-widest">
                > AWAITING ORDINANCE UPLOAD...
            </div>

        </div>
    </template>

    <!-- The Layers -->
    <div id="dim-layer" class="layer-dim startup-fade" style="animation-delay: 1s;"></div>
    <div id="bright-layer" class="layer-bright"></div>
    <div id="visual-beam" class="visual-beam"></div>

    <!-- The Lighthouse Vector Graphic -->
    <div class="lighthouse-container startup-fade">
        <svg viewBox="0 0 120 250" width="100%" height="100%">
            <!-- Monolithic Base -->
            <polygon points="10,250 110,250 80,70 40,70" fill="#030712" stroke="#1e293b" stroke-width="1" />

            <!-- Neck / Mechanical joint -->
            <rect x="45" y="55" width="30" height="15" fill="#0f172a" />
            <line x1="45" y1="62" x2="75" y2="62" stroke="#1e293b" stroke-width="2" />

            <!-- Lantern Housing -->
            <polygon points="35,55 85,55 70,20 50,20" fill="#020617" stroke="#334155" stroke-width="1" />

            <!-- The Glowing Core -->
            <circle cx="60" cy="40" r="8" class="core-light" />

            <!-- Antenna / Spire -->
            <polygon points="58,20 62,20 60,0" fill="#334155" />
        </svg>
    </div>

    <!-- Bottom Footer -->
    <div class="absolute bottom-6 w-full text-center z-40 startup-fade" style="animation-delay: 2s;">
        <span class="font-mono text-[9px] text-slate-600 tracking-widest uppercase">
            Stand by for official deployment
        </span>
    </div>

    <!-- Go Back Button -->
    <a href="index.html#technology" aria-label="Return to Technology Development Section"
        class="absolute bottom-6 right-6 z-50 text-cyan-600 hover:text-cyan-400 font-mono text-[10px] md:text-xs tracking-widest border border-cyan-900/50 hover:border-cyan-500 px-4 py-2 transition-all bg-[#010308]/80 backdrop-blur-sm startup-fade cursor-pointer"
        style="animation-delay: 2.5s; text-decoration: none;">
        &lt; GO BACK
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Clone the template content into both the Dim and Bright layers
            const template = document.getElementById('content-template');
            const dimLayer = document.getElementById('dim-layer');
            const brightLayer = document.getElementById('bright-layer');

            dimLayer.appendChild(template.content.cloneNode(true));
            brightLayer.appendChild(template.content.cloneNode(true));

            // 2. Ignition Sequence
            // Wait 2.5 seconds, then turn on the light beam
            setTimeout(() => {
                document.getElementById('visual-beam').classList.add('beam-active');
            }, 2500);

            // 3. The Sweeping Animation Loop
            // Controls the CSS variable that both the visual beam and the text mask use.
            let angle = 220; // Start angle pointing to the left
            let lastTime = performance.now();
            const speed = 0.015; // Degrees per millisecond

            function sweepLight(currentTime) {
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                // Increment angle
                angle = (angle + (speed * deltaTime)) % 360;

                // Apply the angle to the CSS root variable
                document.documentElement.style.setProperty('--beam-angle', `${angle}deg`);

                requestAnimationFrame(sweepLight);
            }

            // Start the sweep loop
            requestAnimationFrame(sweepLight);

            // 4. Handle Window Resize
            // Keep the origin point of the light mathematically synced with the SVG lantern height
            function updateLanternPosition() {
                // The lantern 'cy' is at 40 in a 250 tall SVG. 
                // That means it is (250 - 40) = 210 SVG units from the bottom.
                // Since our container is 250px tall, it maps 1:1. 
                // Lantern is exactly 210px from the bottom of the screen.
                document.documentElement.style.setProperty('--lantern-y', `calc(100vh - 210px)`);
            }
            window.addEventListener('resize', updateLanternPosition);
            updateLanternPosition(); // Init on load
        });
    </script>
</body>

</html>
